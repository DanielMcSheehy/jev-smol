# Full-text LoRA run: 2 epochs over the text-only synthetic slice (~225 steps).
# Run: .venv/bin/python -m jev.train.sft --config configs/train_textfull.yaml

base_model: HuggingFaceTB/SmolVLM2-500M-Video-Instruct

train_data: data/synthetic/train_text.jsonl
val_data: data/synthetic/val_text.jsonl

out: runs/textfull
seed: 42

max_steps: null
num_train_epochs: 2
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
logging_steps: 10

eval: false
save_strategy: "no"   # adapter written to <out>/adapter at the end

lora:
  r: 16
  alpha: 32
  dropout: 0.1

max_token_len: 1600
