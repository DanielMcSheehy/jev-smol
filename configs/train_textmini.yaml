# Short-but-real LoRA run on the TEXT-ONLY slice of the synthetic dataset
# (text examples are ~700-900 tokens vs ~2600 with images, so MPS fp32 steps
# stay fast). Purpose: demonstrate measurable decision-quality movement.
# Run: .venv/bin/python -m jev.train.sft --config configs/train_textmini.yaml

base_model: HuggingFaceTB/SmolVLM2-500M-Video-Instruct

train_data: data/synthetic/train_text.jsonl
val_data: data/synthetic/val_text.jsonl

out: runs/textmini
seed: 42

max_steps: 40
num_train_epochs: null
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
logging_steps: 5

eval: false
save_strategy: "no"   # adapter written to <out>/adapter at the end

lora:
  r: 16
  alpha: 32
  dropout: 0.1

max_token_len: 1600   # text-only examples fit comfortably
