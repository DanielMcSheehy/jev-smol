# Smoke-test training config for jev LoRA SFT.
# 3 steps, batch 1, no eval; adapter is saved manually at the end only.
# Run: .venv/bin/python -m jev.train.sft --config configs/train_smoke.yaml

base_model: HuggingFaceTB/SmolVLM2-500M-Video-Instruct

train_data: data/synth/train.jsonl
val_data: data/synth/val.jsonl   # present but unused while eval=false

out: runs/smoke-lora
seed: 42

max_steps: 3
num_train_epochs: null
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
lr_scheduler_type: linear
warmup_ratio: 0.0
logging_steps: 1

eval: false
eval_steps: null
save_strategy: "no"   # save only at the end (adapter written to <out>/adapter)

lora:
  r: 8
  alpha: 8
  dropout: 0.1
  # target_modules defaults to the language-only regex in jev.train.sft

# NOTE: with the stock SmolVLM2 processor a single image expands to 1088
# tokens (16 patch tiles + 1 global, 64 tokens each), so image examples are
# ~1600-1700 tokens; the generic default guard (1600) would drop them all.
max_token_len: 2600
