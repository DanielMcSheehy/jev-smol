[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev"
version = "0.1.0"
description = "jev — a small, embedded text+image decision model with a Jev/CLEF (System One) compatible API, built on SmolVLM2-500M"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.0",
    "huggingface_hub>=0.34",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
data = [
    "datasets>=3.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jev = "jev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
